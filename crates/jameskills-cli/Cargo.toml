[package]
name = "jameskills-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "jameskills"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.60", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
jameskills-core = { path = "../jameskills-core" }
jameskills-infra = { path = "../jameskills-infra" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
tokio = { version = "=1.53.1", default-features = false, features = ["rt"] }

[lints]
workspace = true
