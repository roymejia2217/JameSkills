name: JameSkills Rust CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUST_FONTCONFIG_DLOPEN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # v1.98.1
        with:
          toolchain: 1.95.0
          components: clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --features jameskills-desktop/test-support --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked --features jameskills-desktop/test-support
